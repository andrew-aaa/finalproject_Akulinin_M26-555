[project]
name = "finalproject-akulinin-m26-555"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
authors = [
    { name = "Andrey Akulinin", email = "akulinin-andrey2004@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.12.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""
